<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilingual Voice Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header with Calculator / Inset Aesthetic -->
    <header class="header">
      <div class="header-left">
        <div class="app-badge">
          <span class="pulse-dot" id="headerStatusDot"></span>
          <span class="app-title">Voice Assistant</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="dockPinBtn" class="icon-btn" title="Dock to Side Panel" aria-label="Dock or Pin">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button id="closeBtn" class="icon-btn" title="Close" aria-label="Close">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Inset Content Area -->
    <main class="main-body">
      <!-- Voice Input Section -->
      <section class="inset-card voice-card">
        <div class="card-header">
          <span class="card-label">Voice Input (Editable)</span>
          <div class="card-tools">
            <button id="copyInputBtn" class="tool-btn" title="Copy Raw Input" aria-label="Copy Transcript">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
            <button id="clearInputBtn" class="tool-btn" title="Clear text" aria-label="Clear Input">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="input-wrapper">
          <textarea
            id="transcriptInput"
            class="inset-textarea"
            placeholder="Click microphone to speak or type here directly..."
            rows="2"
            spellcheck="true"
          ></textarea>
        </div>

        <!-- Recorder Controls Row -->
        <div class="recorder-row">
          <button id="recordToggleBtn" class="record-btn" title="Start / Stop Voice Recording">
            <div class="mic-icon-wrap">
              <svg class="mic-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </div>
            <span id="recordBtnLabel">Record</span>
          </button>

          <button id="stopBtn" class="stop-btn" title="Stop Recording">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
              <rect x="4" y="4" width="16" height="16" rx="2" ry="2"/>
            </svg>
            <span>Stop</span>
          </button>

          <button id="refineBtn" class="refine-btn" title="AI Refine & Translate to Bangla and English">
            <svg class="sparkle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
              <path d="M5 3v4"/>
              <path d="M19 17v4"/>
              <path d="M3 5h4"/>
              <path d="M17 19h4"/>
            </svg>
            <span id="refineBtnText">Refine</span>
          </button>
        </div>
      </section>

      <!-- Bilingual Output Section -->
      <div class="results-grid">
        <!-- Bangla Output Card -->
        <section class="inset-card result-card" id="banglaCard">
          <div class="card-header">
            <div class="lang-tag">
              <span class="lang-flag">🇧🇩</span>
              <span class="lang-name">Bangla</span>
            </div>
            <div class="card-tools">
              <button id="copyBanglaBtn" class="tool-btn" title="Copy Bangla" aria-label="Copy Bangla">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
              </button>
              <button id="expandBanglaBtn" class="tool-btn expand-btn" title="Expand / Collapse" aria-label="Expand Bangla">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="15 3 21 3 21 9"/>
                  <polyline points="9 21 3 21 3 15"/>
                  <line x1="21" y1="3" x2="14" y2="10"/>
                  <line x1="3" y1="21" x2="10" y2="14"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="output-wrapper">
            <textarea
              id="banglaOutput"
              class="inset-textarea output-area"
              placeholder="বাংলা ফলাফল এখানে প্রদর্শিত হবে..."
              rows="2"
            ></textarea>
          </div>
        </section>

        <!-- English Output Card -->
        <section class="inset-card result-card" id="englishCard">
          <div class="card-header">
            <div class="lang-tag">
              <span class="lang-flag">🇬🇧</span>
              <span class="lang-name">English</span>
            </div>
            <div class="card-tools">
              <button id="copyEnglishBtn" class="tool-btn" title="Copy English" aria-label="Copy English">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
              </button>
              <button id="expandEnglishBtn" class="tool-btn expand-btn" title="Expand / Collapse" aria-label="Expand English">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="15 3 21 3 21 9"/>
                  <polyline points="9 21 3 21 3 15"/>
                  <line x1="21" y1="3" x2="14" y2="10"/>
                  <line x1="3" y1="21" x2="10" y2="14"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="output-wrapper">
            <textarea
              id="englishOutput"
              class="inset-textarea output-area"
              placeholder="English refined output will appear here..."
              rows="2"
            ></textarea>
          </div>
        </section>
      </div>
    </main>

    <!-- Footer Bar -->
    <footer class="footer">
      <div class="status-wrap" id="statusMessage">
        <span class="status-indicator"></span>
        <span class="status-text">Ready</span>
      </div>
      <div class="shortcut-tip">
        <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>X</kbd>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
