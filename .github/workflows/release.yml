name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Chrome Extension
        run: |
          cd extension
          zip -r ../extension.zip . -x ".*" -x "__MACOSX"
          cd ..
          echo "Package size: $(ls -lh extension.zip | awk '{print $5}')"

      - name: Verify Manifest in ZIP Root
        run: |
          unzip -l extension.zip | grep -E "^\s+[0-9]+\s+.*manifest\.json$" || { echo "manifest.json missing at root!"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: extension.zip
          name: Bilingual Voice Assistant ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
